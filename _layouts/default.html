<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}
  <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
  <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
  {% include head-custom.html %}
</head>

<body>
  <div class="wrapper">
    <header>
      {% if site.logo %}
      <img src="{{site.logo | relative_url}}" alt="Logo" />
      {% endif %}

      <p>{{ site.description | default: site.github.project_tagline }}</p>
    </header>
    <section>

      {{ content }}

    </section>
    <footer>
      {% if site.github.is_project_page %}
      <p>This project is maintained by <a href="{{ site.github.owner_url }}">{{ site.github.owner_name }}</a></p>
      {% endif %}
    </footer>
  </div>
  <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const codeBlocks = document.querySelectorAll('pre code.language-mermaid');
      codeBlocks.forEach(function (codeBlock) {
        const pre = codeBlock.parentNode;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = codeBlock.textContent;

        // Replace the containing div if it exists (Jekyll's highlighter-rouge output)
        // Structure is typically: <div class="language-mermaid ..."><div class="highlight"><pre><code>...
        let container = pre;
        if (pre.parentNode && pre.parentNode.classList.contains('highlight')) {
          container = pre.parentNode;
          if (container.parentNode && container.parentNode.classList.contains('language-mermaid')) {
            container = container.parentNode;
          }
        }

        container.parentNode.replaceChild(div, container);
      });

      mermaid.initialize({ startOnLoad: true });
    });
  </script>
</body>

</html>
